name: ollama-bearer-auth

services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUDA_VERSION: "${CUDA_VERSION}"
        OLLAMA_VERSION: "${OLLAMA_VERSION:-latest}"
    image: "${IMAGE_OWNER}/${IMAGE_NAME}:${CUDA_VERSION}"
    runtime: nvidia
    ports:
      - "${EXPOSED_OLLAMA_PORT}:8081"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_API_KEY
      # OLLAMA_FLASH_ATTENTION greately improves performance of qwen3-vl:8b model
      - OLLAMA_FLASH_ATTENTION=1
    volumes:
      - ~/.ollama:/root/.ollama
    restart: unless-stopped
